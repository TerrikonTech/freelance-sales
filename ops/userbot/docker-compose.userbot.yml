# Opt-in stack: nothing here touches the main docker-compose.yml, so a failed
# build or a stopped userbot cannot affect api, worker, postgres or redis.
#
#   cd freelance-sales-v2
#   docker compose -f ops/userbot/docker-compose.userbot.yml build
#   docker compose -f ops/userbot/docker-compose.userbot.yml run --rm userbot --check
#   docker compose -f ops/userbot/docker-compose.userbot.yml up -d
#
# No Telegram credentials are needed here.  The owner's session is already used
# by codex-mesh-hermes-mtproto-sync, which drains the mtproto_outbox table; this
# service only writes rows into that queue and reads back the result.  Opening a
# second client on the same session could invalidate it, so it never does.

services:
  userbot:
    build:
      context: ../..
      dockerfile: ops/userbot/Dockerfile
    image: freelance-sales-userbot:local
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Hand-off stays off until this is flipped to "true" deliberately.
      SALES_USERBOT_ENABLED: "${SALES_USERBOT_ENABLED:-false}"
      SALES_USERBOT_DAILY_LIMIT: "${SALES_USERBOT_DAILY_LIMIT:-20}"
      SALES_USERBOT_POLL_SECONDS: "${SALES_USERBOT_POLL_SECONDS:-20}"
      SALES_USERBOT_STATE_DB: /hermes-state/state.sqlite3
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Read-write: the sender drains what this service queues here.
      - /var/lib/codex-mesh-hermes/exchange/business-bridge-runtime/state:/hermes-state
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    external: true
    name: "${USERBOT_NETWORK:-freelance-sales-v2_internal}"
