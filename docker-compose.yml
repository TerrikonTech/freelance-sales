services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: freelance-sales-app:local
    build: .
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    env_file: .env
    environment:
      TELEGRAM_ON_DEMAND_ONLY: "true"
      STRICT_APPROVAL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8790:3000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./apps/web/dist:/app/apps/web/dist:ro
      - ./apps/api/dist:/app/apps/api/dist:ro
      - ./prompts:/app/prompts:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: freelance-sales-app:local
    build: .
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    mem_limit: 2500m
    memswap_limit: 2500m
    env_file: .env
    environment:
      TELEGRAM_ON_DEMAND_ONLY: "true"
      STRICT_APPROVAL: "false"
      FL_SCAN_INTERVAL_SECONDS: "180"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/documents:/app/data/documents
      - ./apps/api/dist:/app/apps/api/dist:ro
      - ./prompts:/app/prompts:ro
    networks: [internal]
    shm_size: "256mb"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  router-loader:
    image: freelance-sales-app:local
    restart: unless-stopped
    command: ["node", "apps/api/dist/caddy-loader.js"]
    network_mode: host
    volumes:
      - ./ops/caddy-sales.json:/app/ops/caddy-sales.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2019/config/apps/http/servers/srv0/routes/0/handle/0/routes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  ai-broker-openrouter:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/project/ops/sales_openrouter_broker.py"]
    mem_limit: 512m
    memswap_limit: 512m
    network_mode: host
    deploy:
      replicas: 3
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SALES_OPENROUTER_SALES_API: http://127.0.0.1:8790/api/internal/codex
      SALES_OPENROUTER_MODEL_SMART: ${SALES_OPENROUTER_MODEL_SMART:-deepseek/deepseek-v4-flash}
      SALES_OPENROUTER_MODEL_FAST: ${SALES_OPENROUTER_MODEL_FAST:-deepseek/deepseek-v4-flash}
      SALES_OPENROUTER_MODEL_VISION: ${SALES_OPENROUTER_MODEL_VISION:-deepseek/deepseek-v4-flash-vision-exp}
      SALES_OPENROUTER_KEY_FILE: /run/secrets/openrouter-key
      SALES_OPENROUTER_TEMPERATURE: "0.2"
      SALES_OPENROUTER_TIMEOUT_SECONDS: "180"
      SALES_OPENROUTER_USAGE_LOG: /project/runtime/ai-usage/openrouter.jsonl
      SALES_OPENROUTER_DOCUMENTS_DIR: /project/data/documents
      SALES_BROKER_ENV_FILE: /run/secrets/sales-broker.env
    volumes:
      - ./:/project:ro
      - ./runtime/ai-usage:/project/runtime/ai-usage
      - /etc/openrouter/key:/run/secrets/openrouter-key:ro
      - /etc/freelance-sales-broker.env:/run/secrets/sales-broker.env:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  fl-sender:
    image: freelance-sales-app:local
    restart: unless-stopped
    command: ["node", "/ops/server-sender.js"]
    env_file: .env
    environment:
      SENDER_INTERVAL_SEC: "120"
      SENDER_MAX_PER_CYCLE: "1"
      SENDER_MIN_GAP_SEC: "90"
      AUTOSEND_MAX_AGE: "900"
      AUTOSEND_MIN_DEAL_PRICE: "30000"
    shm_size: "256mb"
    mem_limit: 1000m
    memswap_limit: 1000m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ops/fl-sender:/ops:ro
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
