services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: freelance-sales-app:local
    build: .
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    env_file: .env
    environment:
      TELEGRAM_ON_DEMAND_ONLY: "true"
      STRICT_APPROVAL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8790:3000"
    volumes:
      - ./data/documents:/app/data/documents
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: freelance-sales-app:local
    build: .
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      TELEGRAM_ON_DEMAND_ONLY: "true"
      STRICT_APPROVAL: "true"
      FL_SCAN_INTERVAL_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/documents:/app/data/documents
    networks: [internal]
    shm_size: "256mb"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  router-loader:
    image: freelance-sales-app:local
    restart: unless-stopped
    command: ["node", "apps/api/dist/caddy-loader.js"]
    network_mode: host
    volumes:
      - ./ops/caddy-sales.json:/app/ops/caddy-sales.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2019/config/apps/http/servers/srv0/routes/0/handle/0/routes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  telegram-sync:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/app/sales_mtproto_bridge.py"]
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      BUSINESS_OWNER_TELEGRAM_ID: "677822370"
      SALES_BROKER_ENV_FILE: /run/secrets/sales-broker.env
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram-token
      HERMES_STATE_DB: /hermes-state/state.sqlite3
      SALES_TELEGRAM_SYNC_STATE: /runtime/telegram-sync.json
      SALES_TELEGRAM_INTERNAL_API: http://127.0.0.1:8790/api/internal/telegram
      SALES_MTPROTO_TEXT_SYNC: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./ops/sales_mtproto_bridge.py:/app/sales_mtproto_bridge.py:ro
      - /etc/freelance-sales-broker.env:/run/secrets/sales-broker.env:ro
      - /var/lib/codex-mesh/hermes-business/telegram-token:/run/secrets/telegram-token:ro
      - /var/lib/codex-mesh-hermes/exchange/business-bridge-runtime/state:/hermes-state:ro
      - ./runtime:/runtime
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ai-broker:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/project/ops/sales_hermes_broker.py"]
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SALES_HERMES_WORKER_INSTANCE: primary
      SALES_HERMES_SALES_API: http://127.0.0.1:8790/api/internal/codex
      SALES_HERMES_API: http://127.0.0.1:8642/v1
      SALES_HERMES_REQUEST_TIMEOUT_SECONDS: "60"
      SALES_HERMES_MODEL: ${SALES_HERMES_MODEL:-gpt-5.6-sol}
      SALES_HERMES_MODEL_FAST: ${SALES_HERMES_MODEL_FAST:-}
      SALES_HERMES_MODEL_SMART: ${SALES_HERMES_MODEL_SMART:-}
      SALES_HERMES_API_KEY_FILE: /run/secrets/hermes-api-key
      SALES_BROKER_ENV_FILE: /run/secrets/sales-broker.env
      SALES_HERMES_RUNTIME_DIR: /project/runtime/hermes-jobs
      SALES_HERMES_EXCHANGE_DIR: /hermes-exchange
    volumes:
      - ./:/project:ro
      - ./runtime/hermes-jobs:/project/runtime/hermes-jobs
      - /etc/codex-mesh/hermes-api-key:/run/secrets/hermes-api-key:ro
      - /etc/freelance-sales-broker.env:/run/secrets/sales-broker.env:ro
      - /var/lib/codex-mesh-hermes/exchange/sales:/hermes-exchange
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  ai-broker-secondary:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "/project/ops/sales_hermes_broker.py"]
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SALES_HERMES_WORKER_INSTANCE: secondary
      SALES_HERMES_SALES_API: http://127.0.0.1:8790/api/internal/codex
      SALES_HERMES_API: http://127.0.0.1:8642/v1
      SALES_HERMES_REQUEST_TIMEOUT_SECONDS: "60"
      SALES_HERMES_MODEL: ${SALES_HERMES_MODEL:-gpt-5.6-sol}
      SALES_HERMES_MODEL_FAST: ${SALES_HERMES_MODEL_FAST:-}
      SALES_HERMES_MODEL_SMART: ${SALES_HERMES_MODEL_SMART:-}
      SALES_HERMES_API_KEY_FILE: /run/secrets/hermes-api-key
      SALES_BROKER_ENV_FILE: /run/secrets/sales-broker.env
      SALES_HERMES_RUNTIME_DIR: /project/runtime/hermes-jobs-secondary
      SALES_HERMES_EXCHANGE_DIR: /hermes-exchange
    volumes:
      - ./:/project:ro
      - ./runtime/hermes-jobs-secondary:/project/runtime/hermes-jobs-secondary
      - /etc/codex-mesh/hermes-api-key:/run/secrets/hermes-api-key:ro
      - /etc/freelance-sales-broker.env:/run/secrets/sales-broker.env:ro
      - /var/lib/codex-mesh-hermes/exchange/sales:/hermes-exchange
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
